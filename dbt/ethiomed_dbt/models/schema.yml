version: 2

models:
  - name: stg_telegram_messages
    description: "Staging model for raw telegram messages"
    columns:
      - name: message_id
        description: "Unique message identifier"
        tests:
          - not_null
          - unique
      - name: channel
        description: "Telegram channel name"
        tests:
          - not_null
      - name: message_date
        description: "Timestamp of the message"
        tests:
          - not_null

  - name: dim_channels
    description: "Dimension table for telegram channels"
    columns:
      - name: channel
        description: "Telegram channel name"
        tests:
          - not_null
          - unique

  - name: dim_dates
    description: "Dimension table for message dates"
    columns:
      - name: date
        description: "Date of the message"
        tests:
          - not_null
          - unique

  - name: fct_messages
    description: "Fact table for telegram messages"
    columns:
      - name: message_id
        description: "Unique message identifier"
        tests:
          - not_null
          - unique
      - name: channel_id
        description: "Channel reference"
        tests:
          - not_null
      - name: message_date
        description: "Timestamp of the message"
        tests:
          - not_null
